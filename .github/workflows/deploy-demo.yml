name: Deploy Demo to Pages

# 把演示模式构建（vite build --mode demo：用打包样本、不连后端、不要 key）
# 发布到 GitHub Pages。需在仓库 Settings → Pages → Source 选 "GitHub Actions"。
on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 装依赖 + 构建演示版
        # package-lock.json 不入库，用 install 不用 ci
        run: |
          npm --prefix web install
          npm --prefix web run build:demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
