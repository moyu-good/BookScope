<svg width="760" height="300" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="书鉴演示:AI 引的原文回书里核验，对得上才盖鉴印">
  <title>书鉴 · 读真书，每句引文回原文核验</title>
  <!-- 册页(答案卡):数字善本案头 -->
  <rect x="2" y="2" width="756" height="296" rx="16" fill="#F7F2E7" stroke="#D8CDB5"/>
  <rect x="40" y="38" width="680" height="224" rx="12" fill="#FCFAF4" stroke="#E7DEC9"/>

  <!-- 答案标题条 + 正文行 -->
  <rect x="64" y="64" width="150" height="13" rx="6" fill="#33302A" opacity="0.82"/>
  <rect x="64" y="96" width="612" height="9" rx="4" fill="#8A8270" opacity="0.45"/>
  <rect x="64" y="116" width="566" height="9" rx="4" fill="#8A8270" opacity="0.45"/>

  <!-- 引用的原文行:朱砂左栏 + 淡底 -->
  <rect x="64" y="150" width="592" height="64" rx="8" fill="#B23A26" opacity="0.05"/>
  <rect x="64" y="150" width="4" height="64" rx="2" fill="#B23A26"/>
  <rect x="88" y="166" width="150" height="9" rx="4" fill="#8A8270" opacity="0.35"/>
  <rect x="88" y="166" width="150" height="9" rx="4" fill="#8A8270" opacity="0.35"/>
  <text x="88" y="182" font-family="'Noto Serif CJK SC','Songti SC','STSong','SimSun',serif" font-size="15" fill="#5B4A2E">书里写了……（一字一字对过的原文）</text>
  <rect x="88" y="192" width="430" height="9" rx="4" fill="#8A8270" opacity="0.32"/>

  <!-- 鉴印:盖到原文行上(stamp 动画,循环) -->
  <g transform="translate(600,182)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.08;0.22;0.3;0.9;1" dur="4.2s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="0.45;1.14;0.98;1;1;0.45" keyTimes="0;0.18;0.26;0.32;0.9;1" dur="4.2s" repeatCount="indefinite"/>
      <rect x="-26" y="-26" width="52" height="52" rx="10" fill="#B23A26"/>
      <rect x="-19" y="-19" width="38" height="38" rx="6" fill="none" stroke="#F7F2E7" stroke-width="1.5" stroke-opacity="0.5"/>
      <text x="0" y="11" font-family="'Noto Serif CJK SC','Songti SC','STSong','SimSun',serif" font-size="30" font-weight="600" fill="#F7F2E7" text-anchor="middle">鉴</text>
    </g>
  </g>

  <!-- 「原文已核验」小标,随印一起浮现 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.08;0.28;0.36;0.9;1" dur="4.2s" repeatCount="indefinite"/>
    <text x="656" y="240" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13" fill="#B23A26" text-anchor="end">原文已核验</text>
  </g>
</svg>
